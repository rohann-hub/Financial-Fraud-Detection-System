apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
spec:
  replicas: 1                 # stateful: sliding-window features live in this process
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: scoring}
  template:
    metadata:
      labels: {app: scoring}
    spec:
      enableServiceLinks: false      # stops Kubernetes injecting MLFLOW_PORT, KAFKA_PORT and the like
      securityContext: {fsGroup: 1000}
      containers:
        - name: scoring
          image: fraud-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app:app", "--app-dir", "services/scoring", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: fraud-config}
          volumeMounts: [{name: data, mountPath: /app/data}]
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 20
          resources:
            requests: {memory: 1Gi, cpu: 500m}
            limits: {memory: 3Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fraud-data}
---
apiVersion: v1
kind: Service
metadata:
  name: scoring
spec:
  selector: {app: scoring}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst
spec:
  replicas: 1
  selector:
    matchLabels: {app: analyst}
  template:
    metadata:
      labels: {app: analyst}
    spec:
      enableServiceLinks: false      # stops Kubernetes injecting MLFLOW_PORT, KAFKA_PORT and the like
      securityContext: {fsGroup: 1000}
      containers:
        - name: analyst
          image: fraud-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app:app", "--app-dir", "services/analyst", "--host", "0.0.0.0", "--port", "8001"]
          ports: [{containerPort: 8001}]
          envFrom:
            - configMapRef: {name: fraud-config}
            - secretRef: {name: fraud-secrets}
          volumeMounts: [{name: data, mountPath: /app/data}]
          readinessProbe:
            httpGet: {path: /health, port: 8001}
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 768Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fraud-data}
---
apiVersion: v1
kind: Service
metadata:
  name: analyst
spec:
  selector: {app: analyst}
  ports: [{port: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      enableServiceLinks: false      # stops Kubernetes injecting MLFLOW_PORT, KAFKA_PORT and the like
      containers:
        - name: dashboard
          image: fraud-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          resources:
            requests: {memory: 32Mi, cpu: 20m}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: NodePort
  selector: {app: dashboard}
  ports: [{port: 80, nodePort: 30080}]
